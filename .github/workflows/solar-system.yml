name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}    
jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            nodejs_version: [21, 22]
            operating_system: [ubuntu-latest, macos-latest]
            exclude:
              - nodejs_version: 21
                operating_system: macos-latest
        runs-on: ${{ matrix.operating_system }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version - ${{ matrix.nodejs_version}}
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.nodejs_version}}
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          id: unit-testing-for-nodejs
          run: npm test
          
        - name: Archive Test Result
          if: steps.unit-testing-for-nodejs.outcome == 'failure' || steps.unit-testing-for-nodejs.outcome == 'success'
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-${{ matrix.operating_system }}-${{ matrix.nodejs_version }}
            path: test-results.xml

    code-coverage:
      name: Code-Coverage
      runs-on: ubuntu-latest
      steps:
        - name: checkout Repository
          uses: actions/checkout@v6
        - name: Setup NodeJS Version - 22
          uses: actions/setup-node@v6

        - name: Install Dependencies
          run: npm install

        - name: check code coverage
          continue-on-error: true
          run: npm run coverage
        
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5